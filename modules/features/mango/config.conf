exec_once=noctalia -d
source=./binds.conf
source=./monitors.conf

trackpad_natural_scrolling=1

numlock_on=1

new_is_master=0
default_master_factor=0.67
exchange_cross_monitor=1
# tag_gather=1 # this doesn't work with my swap-tags script :(

border_px=2
border_radius=10

focused_opacity=1.0
unfocused_opacity=1.0

animation_type_open=fade

animation_duration_move=300
animation_duration_open=300
animation_duration_tag=300
animation_duration_close=300
animation_duration_focus=100

tag_animation_direction=0

source=~/.config/mango/noctalia.conf
